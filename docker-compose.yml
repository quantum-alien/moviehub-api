version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: moviehub-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - postgres
      - redis
    networks:
      - moviehub

  nginx:
    image: nginx:1.27-alpine
    container_name: moviehub-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - moviehub

  services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: moviehub_test
          POSTGRES_USER: moviehub
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          
  redis:
    image: redis:7-alpine
    container_name: moviehub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - moviehub

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: moviehub-queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3
    volumes:
      - ./:/var/www
    depends_on:
      - postgres
      - redis
    networks:
      - moviehub

networks:
  moviehub:
    driver: bridge

volumes:
  moviehub_pg_data:
