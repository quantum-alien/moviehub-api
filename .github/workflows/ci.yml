name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: moviehub_test
          POSTGRES_USER: moviehub
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_pgsql, redis, zip, bcmath
          coverage: xdebug
          tools: composer:v2

      - name: Copy .env
        run: cp .env.example .env

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Generate JWT secret
        run: php artisan jwt:secret --force

      - name: Run migrations
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: moviehub_test
          DB_USERNAME: moviehub
          DB_PASSWORD: secret
        run: php artisan migrate --force

      - name: Run Pint (code style)
        run: vendor/bin/pint --test

      - name: Run tests with coverage
        env:
          DB_HOST: 127.0.0.1
          DB_DATABASE: moviehub_test
          DB_USERNAME: moviehub
          DB_PASSWORD: secret
          REDIS_HOST: 127.0.0.1
        run: vendor/bin/pest --coverage --min=70

  docker-build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f docker/php/Dockerfile -t moviehub-api:ci .
